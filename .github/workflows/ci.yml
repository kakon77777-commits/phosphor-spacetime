name: PHOSPHOR Spacetime CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          PSS_RUN_WINDOWS_JOB_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m pytest -q
